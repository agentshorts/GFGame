[/Script/Engine.GameSession]
; Up to 10 players per world (a true 5v5 in the MOBA).
MaxPlayers=10

[/Script/GFGame.GFTerritorySubsystem]
; Land radius = BaseRadius + RadiusPerMember x members, capped at MaxRadius (0 = no cap). 2800 lets land grow up to 4 members.
; Curve is the fallback when RadiusByMembers is empty. The layout tests guard the relationships below; these numbers are meant to be tuned.
Curve=(BaseRadius=1200.000000,RadiusPerMember=400.000000,MaxRadius=2800.000000)
; Index 0 is 0 members. Rime is larger than the others at every count of 1 or more.
; Rime to Verdant is 4400 cm. Two 3s sum to 3800 (600 cm gap). A 1 and a 4 sum to 4600 or 4800, so those pairs touch.
+FactionLayout=(Id="Rime",Center=(X=0.000000,Y=0.000000,Z=0.000000),Members=0,RadiusByMembers=(0.000000,1600.000000,1800.000000,2000.000000,3400.000000))
+FactionLayout=(Id="Verdant",Center=(X=-4400.000000,Y=0.000000,Z=0.000000),Members=0,RadiusByMembers=(0.000000,1400.000000,1600.000000,1800.000000,3000.000000))
; Rime to Cinderwrights is 7200 cm. Full radii sum to 6400 (800 cm lava gap). Verdant to Cinderwrights is 11600 cm.
+FactionLayout=(Id="Cinderwrights",Center=(X=7200.000000,Y=0.000000,Z=0.000000),Members=0,RadiusByMembers=(0.000000,1400.000000,1600.000000,1800.000000,3000.000000))
; Wild boxes only. Owned land overrides them. Kind is data, not an enum.
+Hazards=(Id="LavaBridge",Kind="LavaBridge",Center=(X=3700.000000,Y=0.000000,Z=0.000000),HalfExtent=(X=2200.000000,Y=300.000000),BetweenA="Rime",BetweenB="Cinderwrights")
+Hazards=(Id="DeadlyForest",Kind="DeadlyForest",Center=(X=-2300.000000,Y=0.000000,Z=0.000000),HalfExtent=(X=700.000000,Y=1500.000000),BetweenA="Rime",BetweenB="Verdant")

[/Script/GFSocial.GFSocialComponent]
; Faction protection: post a line to all chat when a visitor's protection is turned off (on by default).
; Tokens: {Dragger} = who turned it off, {Target} = who lost it, {Faction} = whose land (the faction id above).
; Placeholder text; swap it for the final line. Empty = no line.
bBroadcastProtectionRevoked=True
ProtectionRevokedChat="lol, {Dragger} just left {Target} out in the open."
; Holds (grab, grow / shrink) only end when someone leaves safe land. True = they also end when the target gets protected.
bReleaseHoldOnProtect=False

[/Script/GFGame.GFFerryDirector]
; Rime (home) <-> Cinderwrights. Stops sit inside each anchor's 1-member disc, so they are on faction land whenever that faction has anyone.
; These branch numbers stay. An art sheet that is not in this repo disagrees (pads, pass price, flight length, mob boxes). That disagreement is a logged Decision.
+Stops=(Id="RimeLanding",AnchorId="Rime",Location=(X=1200,Y=600,Z=0))
+Stops=(Id="CinderLanding",AnchorId="Cinderwrights",Location=(X=6000,Y=600,Z=0))
+Routes=(Id="RimeCinder",StopA="RimeLanding",StopB="CinderLanding",LandRouteHazardId="LavaBridge")
Tuning=(FareItem="Dirt",FareCount=3,PassMaterialItem="FerryTame",PassPrice=5,PassItem="FerryPass",FlightSeconds=12.0,CruiseAltitude=1500.0,BoardRadius=400.0)
MobSpawn=(MobSpecies=("Raptor","Hornback"),MobLevel=10,MobDamagePerLevel=0.15,SpawnIntervalSeconds=8.0,MaxAlive=6,ActivationMargin=1000.0,IdleDespawnSeconds=60.0)

