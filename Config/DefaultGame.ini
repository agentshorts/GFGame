[/Script/GFGame.GFEnvironmentDirector]
; 10 lux keeps the sky atmosphere in its usual range. ExposureBias is applied only when this director creates the sun,
; because auto exposure is off. Nudge these if L_Hub is dark or blown out.
SunIntensity=10.000000
ExposureBias=11.000000

